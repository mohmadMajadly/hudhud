# Integration timing measurement (plan §4.4 flake policy, K15; W7-T1;
# ADR-0014 amendment 7). Runs the integration tests that
# assert an upper time bound repeatedly on the CI runners, with the samples
# each records (`HUDHUD_TIMING_LOG`, packages/claude-code/test/integration/
# support/timing.ts), and summarizes them (`scripts/ci-timing.mjs`): n, min,
# median, p95, max and 3x max per platform and quantity. Bounds are 3x the
# maximum measured on the platform that runs them; the test comments cite the
# run. Samples and per-run logs are kept as an artifact for 3 days. A failed
# test run fails the job after the summary and the upload: a bound that CI
# cannot meet is reported, never hidden.
#
# Cost: each run is the bounded tests only (close deadline, auth fail-fast x2,
# host crash per containment mode, egress): 31-33 s in node:22-bookworm and
# 35-37 s on Windows 11 with the job addon, on the 16-core W7-T1 host (3 runs
# each). Measured on CI (run 38984419523, 15 runs): ubuntu-24.04 9.4 min,
# windows-2025 15.2 min, billed as 10 + 2 x 16 = 42 Linux-equivalent minutes
# (planning multipliers of 04 §1).
#
# macOS (review R8-6) is measured on demand only: dispatch with `platforms:
# macos` (or `all`), or push a `ci-timing/macos-**` branch, which measures
# macOS alone. Cost of one 15-run macOS measurement, measured: runs
# 39061774851 and 39066057814 took 8.0 min each on macos-15, so about 80
# Linux-equivalent minutes at the macOS multiplier of 10 (the estimate was
# 11 min).
#
# The `probe` job (review R2-2, R2-4; FX-B) runs Windows experiments
# instead of the measurement: dispatch with `probe: true`, or push a
# `ci-timing/probe-**` branch (the measurement does not run then). Measured
# locally (Windows 11, 3 trials): about 1 to 4 min; at most 30 min.
name: Integration timing

# Triggers: a dispatch (once this file is on the default branch, which
# GitHub requires for workflow_dispatch), or a push to a `ci-timing/**`
# branch, which measures that branch with the default 15 runs (so a branch
# can be measured before it reaches main). Nothing else runs it.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs of the bounded tests per platform (15 to 30)
        type: number
        default: 15
      platforms:
        description: Platforms to measure (macOS on demand only, R8-6)
        type: choice
        options: [linux-windows, macos, all]
        default: linux-windows
      probe:
        description: Run the Windows probes (R2-2, R2-4) instead of the measurement
        type: boolean
        default: false
  push:
    branches: ['ci-timing/**']

permissions: {}

concurrency:
  group: timing-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: measure (${{ matrix.os }})
    if: ${{ !startsWith(github.ref_name, 'ci-timing/probe-') && inputs.probe != true }}
    runs-on: ${{ matrix.os }}
    # Measured (15 runs each): run 38984419523 windows-2025 15.2 min (setup
    # 71 s, addon 22 s, build 48 s, runs 755 s, 50 s each), ubuntu-24.04
    # 9.4 min (runs 492 s, 33 s each); run 38989537233 windows-2025 13.0 min
    # (runs 564 s, 38 s each), ubuntu-24.04 9.3 min (runs 484 s). Sized for the 30-run maximum on the slower
    # platform: 30 x 50 s + about 2.5 min of setup = 27.5 min; x 2 = 55,
    # rounded up to 56.
    timeout-minutes: 56
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # A `ci-timing/macos-**` push or `platforms: macos` measures macOS alone;
        # `platforms: all` measures the three; otherwise Linux and Windows.
        os: >-
          ${{ fromJSON(
            (inputs.platforms == 'macos' || startsWith(github.ref_name, 'ci-timing/macos-'))
              && '["macos-15"]'
              || (inputs.platforms == 'all'
                && '["ubuntu-24.04","windows-2025","macos-15"]'
                || '["ubuntu-24.04","windows-2025"]')
          ) }}
    steps:
      - name: Check the run count
        env:
          RUNS: ${{ inputs.runs || 15 }}
        run: |
          if ! [[ "$RUNS" =~ ^[0-9]+$ ]] || (( RUNS < 15 || RUNS > 30 )); then
            echo "::error::runs must be a whole number from 15 to 30, got ${RUNS}"
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain, the pinned CLI and the test root
        uses: ./.github/actions/setup
        with:
          node-version: '22'
          integration: 'true'

      # As in ci.yml: the image's toolset, staged with the digest of its bytes.
      - name: Build the job addon (x64) and stage it
        if: runner.os == 'Windows'
        run: pnpm run addon:stage

      - name: Build
        run: pnpm run build

      - name: Run the bounded tests repeatedly
        id: runs
        env:
          RUNS: ${{ inputs.runs || 15 }}
        run: |
          set -uo pipefail
          out="$(if [[ "$RUNNER_OS" == Windows ]]; then cygpath -u "$RUNNER_TEMP"; else printf '%s' "$RUNNER_TEMP"; fi)/timing"
          mkdir -p "$out"
          log="${out}/samples.jsonl"
          : > "$log"
          HUDHUD_TIMING_LOG="$(if [[ "$RUNNER_OS" == Windows ]]; then cygpath -w "$log"; else printf '%s' "$log"; fi)"
          export HUDHUD_TIMING_LOG
          echo "dir=${out}" >> "$GITHUB_OUTPUT"
          failed=0
          for i in $(seq 1 "$RUNS"); do
            start=$SECONDS
            if pnpm exec vitest run --project integration \
              packages/claude-code/test/integration/lifecycle/close-abort.test.ts \
              packages/claude-code/test/integration/security/auth-and-frames.test.ts \
              packages/claude-code/test/integration/security/egress.test.ts \
              packages/claude-code/test/integration/containment/host-crash.test.ts \
              -t 'close with a deadline|fail-fast poisons|nonessential traffic on|host crash during a Bash tool' \
              > "${out}/run-${i}.log" 2>&1; then
              echo "run ${i}: passed in $((SECONDS - start)) s"
            else
              failed=$((failed + 1))
              echo "::error::run ${i} failed after $((SECONDS - start)) s (log in the artifact, run-${i}.log)"
              tail -n 40 "${out}/run-${i}.log"
            fi
          done
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Summarize the samples
        if: always() && steps.runs.outputs.dir != ''
        env:
          DIR: ${{ steps.runs.outputs.dir }}
        run: node scripts/ci-timing.mjs "${DIR}/samples.jsonl"

      - name: Upload the samples and the run logs
        if: always() && steps.runs.outputs.dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timing-${{ runner.os }}
          path: ${{ runner.temp }}/timing
          retention-days: 3
          if-no-files-found: error

      - name: Fail when a run failed
        if: steps.runs.outputs.failed != '0'
        env:
          FAILED: ${{ steps.runs.outputs.failed }}
        run: |
          echo "::error::${FAILED} of the runs failed; see the errors above and the artifact"
          exit 1

  probe:
    name: probe (windows-2025)
    if: ${{ startsWith(github.ref_name, 'ci-timing/probe-') || inputs.probe == true }}
    runs-on: windows-2025
    # Bounded: the stale-pid search tries at most 20000 holders per trial
    # (Windows 11: 1295, 2582 and 4745 tries, about 4 ms each, 19 s for a
    # whole trial; windows-2025, run 39059130622: 506 to 775 tries, the job
    # 3 min with the first PowerShell probe). The PowerShell probe runs one
    # 30 s warming PowerShell and 18 short ones, each capped at 300 s: about
    # 15 x 20-30 s if the cold runs cost what run 39059130622 measured.
    # Expected under 15 min.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      # R2-2 / R2-U2: does `taskkill /T` follow a stale parent pid on Server 2025?
      - name: taskkill /T and a stale parent pid
        run: node scripts/probe/taskkill-stale-ppid.mjs 3

      # R2-4 / R2-U1: the cold module-analysis cost behind checklist 1.11.
      - name: PowerShell cmdlet lookup in a cold profile
        if: always()
        run: node scripts/probe/powershell-module-cache.mjs "$(cygpath -w "$RUNNER_TEMP")\ps-probe"
