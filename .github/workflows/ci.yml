# Risk-tiered CI (ADR-0014). Always triggered, never path-filtered: the
# classify job picks LIGHT / STANDARD / FULL (default FULL) and `ci-gate` is
# the only required check. Renaming `ci-gate` breaks branch protection.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']
  merge_group:
  workflow_dispatch:
    inputs:
      full:
        description: Run the FULL tier (Linux, Windows, macOS)
        type: boolean
        default: false

permissions: {}

# Superseded pull request runs are cancelled; runs on main, tags, schedules
# and dispatches get a unique group so they are never cancelled or replaced.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  classify:
    name: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      linux-node: ${{ steps.classify.outputs.linux-node }}
    steps:
      # A pull request is classified from the merge commit GitHub tests
      # (`refs/pull/<n>/merge`) against its first parent, so depth 2 (the
      # merge commit and both parents) is all the diff needs. The previous
      # `&& 0 || 1` always gave 1 (0 is falsy in expressions): the PR diff
      # failed and every pull request ran FULL (W7-T1).
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Docs-only pushes to main are LIGHT (ADR-0014 amendment 1). The push's
      # `before` commit is fetched alone at depth 1 (a tree diff needs no
      # history). The read-only job token is passed for this one command and
      # not persisted. A new branch (all-zero id) or an unfetchable `before`
      # (force push) leaves the diff uncomputable, and the classifier picks FULL.
      - name: Fetch the commit before the push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
          TOKEN: ${{ github.token }}
        run: |
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
            echo "::add-mask::${auth}"
            # The header goes through the environment, not argv, so it never
            # appears in the process list.
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
              git fetch --no-tags --depth=1 origin "$BEFORE" \
              || echo "::warning::could not fetch the push base; the classifier will choose FULL"
          fi

      - name: Classify the change set
        id: classify
        env:
          CI_FULL_REQUESTED: ${{ inputs.full == true }}
        run: node scripts/ci-classify.mjs

  docs:
    name: docs
    needs: classify
    if: needs.classify.outputs.tier == 'LIGHT'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node-version: '22'

      # The documentation is under `prettier --check .` (the first step of
      # `pnpm check`), and markdownlint does not apply prettier's rules, so a
      # docs-only change is format-checked here as FULL would (R7-1).
      - name: Format check
        run: pnpm run format:check

      - name: Markdown lint and offline link check
        run: pnpm run lint:md

      - name: Privacy scan of the tree
        run: pnpm run privacy:tree

  linux:
    name: linux (node ${{ matrix.node }})
    needs: classify
    if: needs.classify.outputs.tier == 'STANDARD' || needs.classify.outputs.tier == 'FULL'
    runs-on: ubuntu-24.04
    # K15 (ADR-0014 amendment 7): measured p95 x 2. Nine jobs with
    # integration (W7-T1), node 22/24/26: run 38980330927 8.5/9.4/9.2 min,
    # run 38984419589 8.6/10.0/8.7 min, run 38989536648 10.3/6.8/7.3 min;
    # per job 30-44 s setup with the CLI fetch, 3.0-5.0 min check, 30-47 s OS
    # coverage, 2.7-4.0 min integration. p95 (nearest rank of 9: the
    # maximum) 10.3 min; x 2 = 20.7, rounded up to 21.
    timeout-minutes: 21
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        node: ${{ fromJSON(needs.classify.outputs.linux-node) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain, the pinned CLI and the test root
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
          integration: 'true'

      # `pnpm check:full` is check, check:tarball, cli:fetch (in the setup
      # action) and test:integration; split into steps so a failure names its
      # phase. check:tarball packs and installs the published packages offline
      # (7 s on the W7-Z Windows host); it leaves HUDHUD_TEST_ROOT empty.
      - name: Check (format, build, lint, depcruise, tests with coverage, API reports, privacy)
        run: pnpm run check

      - name: Tarball install check of every published package (plan §4.1)
        run: pnpm run check:tarball

      - name: OS-scoped coverage of the syscall adapters (plan §4.8)
        run: pnpm exec vitest run --coverage --config vitest.os.config.ts

      - name: Integration tests against the pinned CLI
        run: pnpm run test:integration

  # The engines floor, Node 22.12.0 exactly (R7-7, ADR-0014 amendment 11):
  # setup-node installs the newest release of a major everywhere else, so an
  # API added after 22.12.0 would pass CI and fail users on the floor. pnpm
  # 11 itself needs Node 22.13 or newer, so the install, the build and the CLI
  # fetch run on the newest 22 (the setup action), and the tests then run on
  # 22.12.0 through vitest directly: the unit, conformance and scripts
  # projects and the integration project (the product, its children and the
  # test harness all on the floor). Cost: one more Linux job on STANDARD and
  # FULL, measured 5.6 min in its first run (FULL run 39065841901; Linux
  # 1x), so about +6 of about 140 Linux-equivalent minutes per FULL run.
  node-floor:
    name: linux (node 22.12.0, engines floor)
    needs: classify
    if: needs.classify.outputs.tier == 'STANDARD' || needs.classify.outputs.tier == 'FULL'
    runs-on: ubuntu-24.04
    # K15: p95 x 2 from one sample, FULL run 39065841901: 5.6 min (the p95
    # of one sample is that sample); x 2 = 11.2, rounded up to 12. Re-size
    # as runs accumulate.
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain (newest Node 22 for pnpm), the pinned CLI and the test root
        uses: ./.github/actions/setup
        with:
          node-version: '22'
          integration: 'true'

      - name: Build
        run: pnpm run build

      - name: Install Node.js 22.12.0 (the engines floor)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Require Node.js 22.12.0
        run: test "$(node --version)" = v22.12.0

      - name: Unit, conformance and scripts tests on the floor
        run: node node_modules/vitest/vitest.mjs run --project unit --project conformance --project scripts

      - name: Integration tests against the pinned CLI on the floor
        run: node node_modules/vitest/vitest.mjs run --project integration

  windows:
    name: windows (node 22)
    needs: [classify, linux]
    if: needs.classify.outputs.tier == 'FULL'
    runs-on: windows-2025
    # K15 (ADR-0014 amendment 7): measured p95 x 2, two samples. Run
    # 38984419589 (W7-T1 round B): 24.9 min (setup with the CLI fetch 77 s,
    # addon build 21 s, check 532 s, OS coverage 113 s, integration 731 s,
    # including about 105 s the child-launch probe lost to PowerShell in the
    # sandbox, removed since, and one 60 s hang-guard expiry). Run
    # 38989536648 (round C): 22.5 min (78 s, 23 s, 503 s, 98 s, 618 s).
    # p95 (the maximum of 2) 24.9 min; x 2 = 49.8, rounded up to 50.
    # Re-size as runs accumulate.
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain, the pinned CLI and the test root
        uses: ./.github/actions/setup
        with:
          node-version: '22'
          integration: 'true'

      # Windows checks exercise the real job addon (plan §6.2, lead rulings on
      # A2): it is built here with the image's default toolset and staged; the
      # suites load it with the digest of the staged bytes. The committed
      # table holds the release record and is checked against the build only
      # on the toolchain of record (scripts/test/addon-record.test.ts says
      # which fields differ otherwise). The toolchain is recorded first, with
      # whether the toolset of record (A3) is on the image. A missing
      # component fails the job with its name: nothing is installed here and
      # `/Qspectre` is never dropped.
      - name: Record the job addon toolchain
        run: |
          set -euo pipefail
          vswhere='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
          tools=Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          spectre=Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre
          cmake --version | head -n 1
          install="$("$vswhere" -latest -products '*' -requires "$tools" -property installationPath)"
          if [[ -z "$install" ]]; then
            echo "::error::no Visual Studio instance on this image has ${tools} (the MSVC x64 tools)"
            exit 1
          fi
          echo "Visual Studio $("$vswhere" -latest -products '*' -requires "$tools" -property catalog_productDisplayVersion) at ${install}"
          if [[ -z "$("$vswhere" -latest -products '*' -requires "$tools" "$spectre" -property installationPath)" ]]; then
            echo "::error::the runner image lacks ${spectre}, the Spectre-mitigated libraries the addon links with /Qspectre; it is never installed or dropped here"
            exit 1
          fi
          root="$(cygpath -u "$install")"
          msvc="$(tr -d '\r\n' < "${root}/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt")"
          echo "MSVC toolset ${msvc}"
          # cl without arguments prints its banner (compiler version) and a usage line.
          "${root}/VC/Tools/MSVC/${msvc}/bin/Hostx64/x64/cl.exe" 2>&1 | head -n 1 || true
          # The toolset of record (native/win32-job/release/, MSVC 14.44.35207
          # with Spectre libraries, Windows SDK 10.0.26100): reported, never
          # installed (A3 relies on these lines).
          echo "MSVC toolsets in that instance: $(find "${root}/VC/Tools/MSVC" -mindepth 1 -maxdepth 1 -printf '%f ')"
          for component in \
            Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64 \
            Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64.Spectre \
            Microsoft.VisualStudio.Component.Windows11SDK.26100; do
            if [[ -n "$("$vswhere" -latest -products '*' -requires "$component" -property installationPath)" ]]; then
              echo "toolset of record: ${component} installed"
            else
              echo "toolset of record: ${component} NOT installed"
            fi
          done

      - name: Build the job addon (x64) with the image's toolset and stage it
        run: |
          set -euo pipefail
          pnpm run addon:stage
          echo 'staged toolchain.json:'
          cat packages/win32-job-x64/toolchain.json

      - name: Check (format, build, lint, depcruise, tests with coverage, API reports, privacy)
        run: pnpm run check

      - name: Tarball install check of every published package (plan §4.1)
        run: pnpm run check:tarball

      - name: OS-scoped coverage of the syscall adapters (plan §4.8)
        run: pnpm exec vitest run --coverage --config vitest.os.config.ts

      - name: Integration tests against the pinned CLI
        run: pnpm run test:integration

  macos:
    name: macos (darwin-arm64, node 22)
    needs: [classify, linux]
    if: needs.classify.outputs.tier == 'FULL'
    runs-on: macos-15
    # K15: p95 x 2 (research 11 §8). Integration on macOS since the macOS
    # gate passed (W7-T4, runs 38967893191 and 38977497768; ADR-0014
    # amendment 6), so the job runs what the Linux and Windows jobs run.
    # Parts, maxima of the measured runs: setup 15 s (W7-T1 runs 38984419589
    # and 38989536648), check 94 s and OS coverage 7 s (same runs), the CLI
    # fetch with the build 45 s and the integration project 142 s (the macOS
    # gate's integration evidence job, the two runs above). About 5 min;
    # research 11 §8 took the check as 3 min (the pre-gate estimate), about
    # 6 min, times 2 = 12. The first FULL run with integration replaces the
    # estimate parts.
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain, the pinned CLI and the test root
        uses: ./.github/actions/setup
        with:
          node-version: '22'
          integration: 'true'

      # `pnpm check:full` in steps, as on Linux and Windows.
      - name: Check (format, build, lint, depcruise, tests with coverage, API reports, privacy)
        run: pnpm run check

      - name: Tarball install check of every published package (plan §4.1)
        run: pnpm run check:tarball

      - name: OS-scoped coverage of the syscall adapters (plan §4.8)
        run: pnpm exec vitest run --coverage --config vitest.os.config.ts

      - name: Integration tests against the pinned CLI
        run: pnpm run test:integration

  ci-gate:
    name: ci-gate
    needs: [classify, docs, linux, node-floor, windows, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Evaluate the results of every job
        env:
          CI_TIER: ${{ needs.classify.outputs.tier }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
