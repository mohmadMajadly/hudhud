# Windows job addon: prebuild and release verification (plan §6.3, K17; lead
# ruling on A2). The invariant: the bytes a release publishes equal its
# release record, native/win32-job/release/<release>/manifest.json, and
# every rebuild must reproduce that record. The procedure end to end is in
# native/win32-job/README.md ("Releasing").
#
# Phase 1, record (`workflow_dispatch`, input `release`): `build` compiles
# x64 and arm64 with the toolset of record (build.mjs --toolset-of-record),
# `test-x64` runs the addon tests on the x64 build with the record check
# required to run, and `manifest` writes the candidate record (manifest.json,
# SHA256SUMS, toolchain.json) as the artifact `addon-record`. The lead then
# builds locally with the same pin, compares (scripts/addon/manifest.mjs
# compare), and only on a match commits the record and the table.
#
# Phase 2, verify (`workflow_call` with `phase: verify` from release.yml,
# which a tag `v<version>` runs; ADR-0014 amendments 10 and 12): the same
# builds must reproduce the committed record the core's digest table names
# (the addon is versioned by its record: `@hudhudjs/win32-job-x64` carries
# the record's `release`, the tag names the version of the library
# packages), and `release-verify` packs every package and hashes the packed
# bytes again, and checks the tag against the packed versions, the private
# flags, the changesets and the source links (scripts/check-tarball.mjs
# --release-tag), keeps the tarballs of the published packages, runs the
# full tarball check over exactly those tarballs (`check-tarball.mjs
# --tarballs`, plan §4.1, §6.3) and uploads them as `release-tarballs`, the
# bytes release.yml's publish job publishes. With `dry_run` (release.yml's
# dry runs) it first simulates the version PR in its working copy
# (scripts/release.mjs simulate-version) and checks the tag that gives.
# Phase 2 runs only through release.yml (one tag run, publish after it);
# this file has no tag trigger of its own.
#
# Security (ADR-0014): triggered only by a dispatch or a call from
# release.yml, never by pull_request_target; every job holds `contents:
# read` only, no secret is referenced, so the tag jobs hold no write token
# (release.yml's publish job, after these, is the only one with id-token:
# write); actions are pinned by
# full commit SHA; checkout does not persist credentials; dependencies are
# installed from the frozen lockfile without scripts; no cache is read or
# written; artifacts are kept 3 days (`release-tarballs` 7, so the publish
# job can wait for its environment's approval) and downloads verify their
# digest.
# The only install on a runner is the Visual Studio installer step in
# `build`, which adds the toolset-of-record components the image lacks
# (exact ids from the record) and verifies them with vswhere afterwards.
# Besides it, `build` downloads the CMake of record (the record's
# `cmakeVersion`, Kitware's release zip checked against Kitware's SHA-256
# list) into the runner's temporary directory and passes it to the build
# through HUDHUD_CMAKE; nothing is installed for it (R7-4).
# Inputs reach scripts through the environment, never by interpolation.
#
# Timeouts (K15): measured duration x 2, rounded up, from the first phase 1
# run (Addon prebuild run 38947897592, 2026-10-16):
# - installer step: 335 s (x64) and 317 s (arm64), so 12 minutes;
# - build job: 7 min 11 s (x64) and 6 min 58 s (arm64), so 15 minutes;
# - build step: not measured on its own; under 1 min of the job (5 s and
#   4 s locally), 5 minutes as a hang guard;
# - CMake download and unpack steps: not measured yet (a zip of about 50
#   MB and its unpacking); 5 minutes each as hang guards, inside the job's
#   15, to be re-sized from the first run (FX-D);
# - test-x64: 4 min 13 s, so 10 minutes;
# - manifest: under 1 min, 5 minutes.
# release-verify has not run yet (it runs on tags and release dry runs
# only): estimated about 4 min from the test-x64 setup and build steps plus
# the packing (under 10 s locally), the full tarball check (7 s locally,
# W7-Z) and, in a dry run, `changeset version` (under 5 s locally), 10
# minutes until its first run is measured.
name: Addon prebuild

on:
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Release the record is written for: the version
          @hudhudjs/win32-job-x64 will carry (for example 0.1.0; ADR-0014
          amendment 10). It names the record directory
          native/win32-job/release/<release>/.
        type: string
        required: true
  # Phase 2, from release.yml only (a tag, or a release dry run).
  workflow_call:
    inputs:
      phase:
        description: Always `verify` (phase 2); phase 1 is a dispatch of this file.
        type: string
        required: true
      tag:
        description: >-
          The release tag to check (`v<version>`); empty in a dry run, which
          checks the tag its simulated version PR gives.
        type: string
        required: false
        default: ''
      dry_run:
        description: >-
          Simulate the version PR in the working copy first (release.yml's
          dry runs); never on a tag.
        type: boolean
        required: true
    outputs:
      tag:
        description: The tag release-verify checked.
        value: ${{ jobs.release-verify.outputs.tag }}

permissions: {}

concurrency:
  group: addon-prebuild-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: windows-2025
    # Measured 7 min 11 s (x64) and 6 min 58 s (arm64), run 38947897592; x 2.
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies (frozen lockfile, no scripts, no cache)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Record the toolchain on the image
        run: |
          set -euo pipefail
          vswhere='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
          cmake --version | head -n 1
          install="$("$vswhere" -latest -products '*' -property installationPath)"
          if [[ -z "$install" ]]; then
            echo "::error::no Visual Studio instance on this image"
            exit 1
          fi
          echo "Visual Studio $("$vswhere" -latest -products '*' -property catalog_productDisplayVersion) at ${install}"
          root="$(cygpath -u "$install")"
          echo "default MSVC toolset $(tr -d '\r\n' < "${root}/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt")"
          echo "MSVC toolsets: $(find "${root}/VC/Tools/MSVC" -mindepth 1 -maxdepth 1 -printf '%f ')"
          echo "Windows SDKs: $(find '/c/Program Files (x86)/Windows Kits/10/Lib' -mindepth 1 -maxdepth 1 -printf '%f ')"
          # The record's components for this arch, and the image's default
          # tools for it (K17: reported, the pinned build does not use them).
          default_tools=Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          [[ "$ARCH" == arm64 ]] && default_tools=Microsoft.VisualStudio.Component.VC.Tools.ARM64
          for component in $(node scripts/addon/manifest.mjs components --arch "$ARCH") "$default_tools"; do
            if [[ -n "$("$vswhere" -latest -products '*' -requires "$component" -property installationPath)" ]]; then
              echo "component ${component}: installed"
            else
              echo "component ${component}: NOT installed"
            fi
          done

      # The only install of this workflow, and only here: the components of
      # the toolset of record the image lacks, by exact id, into the image's
      # Visual Studio instance. A failure names the installer's exit code,
      # its log tail and every id still missing.
      - name: Install the missing toolset-of-record components
        # Measured 335 s (x64) and 317 s (arm64), run 38947897592; x 2.
        timeout-minutes: 12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $dir 'vswhere.exe'
          $installer = Join-Path $dir 'setup.exe'
          $install = & $vswhere -latest -products '*' -property installationPath
          $ids = @(node scripts/addon/manifest.mjs components --arch $env:ARCH)
          if ($LASTEXITCODE -ne 0 -or $ids.Count -eq 0) { Write-Output '::error::the components of the toolset of record could not be read'; exit 1 }
          function Get-Missing {
            @($ids | Where-Object { @(& $vswhere -all -products '*' -requires $_ -property installationPath) -notcontains $install })
          }
          $missing = Get-Missing
          if ($missing.Count -eq 0) { Write-Output "all components of the toolset of record are installed in $install"; exit 0 }
          Write-Output "installing into ${install}: $($missing -join ', ')"
          $arguments = @('modify', '--installPath', "`"$install`"", '--passive', '--norestart') + @($missing | ForEach-Object { '--add', $_ })
          $started = Get-Date
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          # Wait for any installer process that outlived its parent.
          $deadline = (Get-Date).AddMinutes(10)
          while (@(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$dir\*" }).Count -gt 0) {
            if ((Get-Date) -gt $deadline) { Write-Output '::error::Visual Studio installer processes still running 10 minutes after the installer returned'; exit 1 }
            Start-Sleep -Seconds 5
          }
          $seconds = [int]((Get-Date) - $started).TotalSeconds
          Write-Output "installer exit code $($process.ExitCode) after $seconds s"
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            Get-ChildItem $env:TEMP -Filter 'dd_*.log' | Sort-Object LastWriteTime | Select-Object -Last 2 | ForEach-Object {
              Write-Output "== $($_.Name) (tail)"
              Get-Content $_.FullName -Tail 40
            }
            Write-Output "::error::the Visual Studio installer failed with exit code $($process.ExitCode) adding $($missing -join ', ')"
            exit 1
          }
          if ($process.ExitCode -eq 3010) { Write-Output '::notice::the installer reports that a restart is required (3010); the components are verified next' }
          $still = Get-Missing
          if ($still.Count -gt 0) { Write-Output "::error::still not installed in ${install} after the installer: $($still -join ', ')"; exit 1 }
          Write-Output "installed and verified with vswhere: $($missing -join ', ')"

      # The CMake of record (review finding R7-4): `cmakeVersion` is a field
      # that can change the bytes, so `check-toolchain` and `verify` require
      # it exactly, while the image's CMake moves with image updates. The
      # release build therefore uses exactly the record's version, downloaded
      # from Kitware's GitHub release of that version and checked against
      # the SHA-256 list Kitware publishes with it (same TLS origin: it
      # catches a corrupt or substituted download, not a compromised
      # release; what the build produces is held to the record's sha256 by
      # the verify steps, and the record to an independent local build).
      - name: Download the CMake of record and check its sha256
        timeout-minutes: 5
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { DIGESTS_MODULE, parseDigestsModule, parseManifest } from "./scripts/lib/addon-digests.mjs";
            const table = parseDigestsModule(readFileSync(DIGESTS_MODULE, "utf8"));
            const record = parseManifest(readFileSync(table.manifest, "utf8"));
            process.stdout.write(record.arches[process.env.ARCH].toolchain.cmakeVersion);
          ')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the record's cmakeVersion ${version@Q} is not x.y.z"
            exit 1
          fi
          zip="cmake-${version}-windows-x86_64.zip"
          base="https://github.com/Kitware/CMake/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/cmake"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/cmake/$zip" "$base/$zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/cmake/SHA-256.txt" "$base/cmake-${version}-SHA-256.txt"
          expected="$(awk -v name="$zip" '$2 == name { print $1 }' "$RUNNER_TEMP/cmake/SHA-256.txt")"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Kitware's SHA-256 list of CMake ${version} names no sha256 for ${zip}"
            exit 1
          fi
          # Hash stdin: given a file name with a backslash (RUNNER_TEMP is a
          # Windows path here), GNU sha256sum escapes the line and prefixes
          # the digest with `\` (run 39065844822).
          actual="$(sha256sum < "$RUNNER_TEMP/cmake/$zip" | cut -d ' ' -f 1)"
          if [[ ! "$actual" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::sha256sum gave no digest for ${zip} (${actual@Q})"
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::${zip} is sha256 ${actual}, Kitware's list names ${expected}"
            exit 1
          fi
          echo "CMake ${version}: ${zip} sha256 ${actual} (matches Kitware's list)"
          echo "CMAKE_OF_RECORD=${version}" >> "$GITHUB_ENV"

      - name: Unpack the CMake of record and point the build at it
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:CMAKE_OF_RECORD
          $dir = Join-Path $env:RUNNER_TEMP 'cmake'
          Expand-Archive -Path (Join-Path $dir "cmake-$version-windows-x86_64.zip") -DestinationPath $dir
          $cmake = Join-Path $dir "cmake-$version-windows-x86_64\bin\cmake.exe"
          $banner = @(& $cmake --version)[0]
          if ($LASTEXITCODE -ne 0 -or $banner -ne "cmake version $version") {
            Write-Output "::error::$cmake reports '$banner', the record requires cmake version $version"
            exit 1
          }
          Write-Output "$banner at $cmake"
          "HUDHUD_CMAKE=$cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build with the toolset of record
        timeout-minutes: 5
        run: node native/win32-job/build.mjs --toolset-of-record --arch "$ARCH"

      - name: Collect the build
        run: node scripts/addon/manifest.mjs collect --arch "$ARCH" --out "$RUNNER_TEMP/addon/$ARCH"

      # Phase 1 records whatever the pinned toolchain produces, so a
      # difference from the committed record is reported, not fatal here:
      # test-x64 (record check) and the lead's local compare decide.
      - name: Compare with the record the digest table names (phase 1)
        if: inputs.phase != 'verify'
        run: |
          if ! node scripts/addon/manifest.mjs verify --dir "$RUNNER_TEMP/addon/$ARCH"; then
            echo "::warning::the ${ARCH} build does not reproduce the committed record (reason above)"
          fi

      # The record the core's digest table names: the addon release this
      # library release ships (ADR-0014 amendment 10).
      - name: Require the rebuild to reproduce the release record (phase 2)
        if: inputs.phase == 'verify'
        run: node scripts/addon/manifest.mjs verify --dir "$RUNNER_TEMP/addon/$ARCH"

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-${{ matrix.arch }}
          path: ${{ runner.temp }}/addon/${{ matrix.arch }}
          retention-days: 3
          if-no-files-found: error

  test-x64:
    name: test (x64)
    needs: build
    runs-on: windows-2025
    # Measured 4 min 13 s with every step run, run 38947897592; x 2, rounded.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies (frozen lockfile, no scripts, no cache)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the x64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: addon-x64
          path: ${{ runner.temp }}/addon/x64
          digest-mismatch: error

      # The record check (scripts/test/addon-record.test.ts) runs only on the
      # toolchain of record and is skipped otherwise; here it must run. This
      # is the same comparison (every field that can change the bytes; a
      # different generator is reported as information, run 38947897592),
      # so a skip fails the job and names every differing field with both
      # values. The steps after it
      # still run, so one run shows everything.
      - name: Require the toolchain of record (the record check must run)
        id: toolchain
        run: node scripts/addon/manifest.mjs check-toolchain --toolchain "$RUNNER_TEMP/addon/x64/toolchain.json"

      - name: Stage the build into its platform package
        id: stage
        if: ${{ !cancelled() }}
        run: >-
          node scripts/addon/write-digests.mjs --stage --arch x64
          --addon "$RUNNER_TEMP/addon/x64/hudhud_win32_job.node"
          --toolchain "$RUNNER_TEMP/addon/x64/toolchain.json"

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: pnpm run build

      # Plan §6.5: loader unit tests, the staged addon through the real
      # loader with A1's native suite (create/assign/list/terminate, handle
      # not inherited, host crash, idempotency, digest mismatch), the record
      # check through the product path ('host'), and the package shapes.
      - name: Addon loader, native and record tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          pnpm exec vitest run --project scripts --project unit
          scripts/test/addon- packages/core/test/process/containment
          tooling/test-support/test/launcher/staged-addon

      - name: Fetch the pinned CLI (registry integrity checked)
        id: cli
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm run cli:fetch

      # Plan §6.5 "CLI Bash tree" and "host crash": the pinned CLI under
      # 'job', zero survivors.
      - name: Containment suites under 'job' (pinned CLI)
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        run: pnpm exec vitest run --project integration packages/claude-code/test/integration/containment

  # Phase 1 only: on a tag the record is committed already, and the build
  # job has verified the rebuild against it.
  manifest:
    name: manifest
    needs: build
    if: inputs.phase != 'verify'
    runs-on: ubuntu-24.04
    # Under 1 min in run 38947897592 (no dependency install: the tool uses
    # Node built-ins only); 5 minutes.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Download the x64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: addon-x64
          path: ${{ runner.temp }}/addon/x64
          digest-mismatch: error

      - name: Download the arm64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: addon-arm64
          path: ${{ runner.temp }}/addon/arm64
          digest-mismatch: error

      - name: Write the release record
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          node scripts/addon/manifest.mjs write --release "$RELEASE_INPUT" --dir "$RUNNER_TEMP/addon" --out "$RUNNER_TEMP/record"
          for file in manifest.json SHA256SUMS toolchain.json; do
            echo "== ${file}"
            cat "$RUNNER_TEMP/record/${file}"
          done

      - name: Upload the release record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-record
          path: ${{ runner.temp }}/record
          retention-days: 3
          if-no-files-found: error

  release-verify:
    name: release verify (packed bytes)
    if: inputs.phase == 'verify'
    needs: [build, test-x64]
    runs-on: windows-2025
    # Setup about 2 min, pnpm build about 1 min, the packing under 1 min (the
    # full local check took under 10 s), the full tarball check under 1 min
    # (7 s locally), changeset version in a dry run under 5 s locally. About
    # 4 min, x 2.
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies (frozen lockfile, no scripts, no cache)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the x64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: addon-x64
          path: ${{ runner.temp }}/addon/x64
          digest-mismatch: error

      - name: Download the arm64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: addon-arm64
          path: ${{ runner.temp }}/addon/arm64
          digest-mismatch: error

      # arm64 cannot be loaded on this x64 host; its version is the one the
      # x64 build reported (same source), which staging checks is semver.
      - name: Stage both builds into their platform packages
        run: |
          set -euo pipefail
          addon="$RUNNER_TEMP/addon"
          node scripts/addon/write-digests.mjs --stage --arch x64 \
            --addon "$addon/x64/hudhud_win32_job.node" --toolchain "$addon/x64/toolchain.json"
          node scripts/addon/write-digests.mjs --stage --arch arm64 \
            --addon "$addon/arm64/hudhud_win32_job.node" --toolchain "$addon/arm64/toolchain.json" \
            --version "$(cat "$addon/x64/version")"

      # A tag checks itself. A dry run (release.yml off a tag) first does
      # what the version PR will do, in this working copy only: changeset
      # version and, when the committed record is not the addon version that
      # gives, a record of the same builds for it (scripts/release.mjs
      # simulate-version, which refuses to run on a tag); it checks the tag
      # that version PR's commit would get.
      - name: The tag to check (a dry run simulates the version PR)
        id: tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then
            node scripts/release.mjs simulate-version
          elif [[ "$GITHUB_REF_TYPE" == tag && "$TAG_INPUT" == "$GITHUB_REF_NAME" ]]; then
            echo "tag=${TAG_INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::phase 2 checks the pushed tag: input tag ${TAG_INPUT@Q}, ref ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME@Q}"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # The packed bytes against the record the core's table names, and the
      # tag against the packed versions, private flags, changesets and source
      # links (ADR-0014 amendment 10, review finding R7-2); the tarballs of
      # the published packages are kept for the publish (amendment 12).
      - name: Pack, hash the bytes a release would publish and check the tag
        env:
          HUDHUD_TEST_ROOT: ${{ runner.temp }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/check-tarball.mjs --release-tag "$RELEASE_TAG" --keep-tarballs "$RUNNER_TEMP/release-tarballs"

      # The full check of every published package (plan §4.1) over exactly
      # the tarballs kept above: files, manifest, README, LICENSE and NOTICE,
      # entry points, an offline install of the tarballs, imports and a
      # type-check; the x64 package with the staged build above (W6-Z ruling
      # 8, lead ruling on A3).
      - name: Full tarball check of the tarballs a release publishes
        env:
          HUDHUD_TEST_ROOT: ${{ runner.temp }}
        run: node scripts/check-tarball.mjs --tarballs "$RUNNER_TEMP/release-tarballs"

      # Kept 7 days: release.yml's publish job may wait for the approval of
      # its environment.
      - name: Upload the checked tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/release-tarballs
          retention-days: 7
          if-no-files-found: error
