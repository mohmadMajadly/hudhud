name: Setup toolchain
description: >-
  Installs the pinned pnpm and the requested Node version, restores the pnpm
  store cache and runs a frozen, script-free install. The cache is written
  only by pushes to main (ADR-0014).
inputs:
  node-version:
    description: Node.js version (major) to install.
    required: true
  pnpm-installer:
    description: >-
      How pnpm is installed. `action-setup` (default): pnpm/action-setup, which
      bootstraps pnpm from its committed npm lockfile and runs `pnpm
      self-update` to the packageManager version; the self-update verifies the
      @pnpm/exe native binary of the runner's platform, and pnpm 11 ships none
      for Intel macOS (@pnpm/macos-x64 ends at 11.0.4; pnpm issue 11423), so
      it cannot run on darwin-x64 (macOS gate run 1, research 09).
      `corepack`: the Corepack bundled with Node.js (Node 22 to 24 only)
      installs exactly the packageManager version of the JavaScript `pnpm`
      package after verifying its npm registry signature with Corepack's
      built-in keys (verified 2026-10-13: a wrong key set makes the install
      fail). Used for darwin-x64 only.
    required: false
    default: action-setup
runs:
  using: composite
  steps:
    - name: Reject an unknown pnpm installer
      if: inputs.pnpm-installer != 'action-setup' && inputs.pnpm-installer != 'corepack'
      shell: bash
      run: |
        echo "::error::unknown pnpm-installer: ${PNPM_INSTALLER}"
        exit 1
      env:
        PNPM_INSTALLER: ${{ inputs.pnpm-installer }}

    - name: Install pnpm (version from package.json "packageManager")
      if: inputs.pnpm-installer == 'action-setup'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Install pnpm through Corepack (signature-verified, version from "packageManager")
      if: inputs.pnpm-installer == 'corepack'
      shell: bash
      run: |
        echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0" >> "$GITHUB_ENV"
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable pnpm
        test "$(pnpm --version)" = "$(node -p 'require("./package.json").packageManager.split("@")[1]')"

    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore the pnpm store
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-

    - name: Install dependencies (frozen lockfile, no install scripts)
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Save the pnpm store (main only)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
