# Risk-tiered CI (ADR-0014). Always triggered, never path-filtered: the
# classify job picks LIGHT / STANDARD / FULL (default FULL) and `ci-gate` is
# the only required check. Renaming `ci-gate` breaks branch protection.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']
  merge_group:
  workflow_dispatch:
    inputs:
      full:
        description: Run the FULL tier (Linux, Windows, macOS)
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: Run the FULL tier (Linux, Windows, macOS)
        type: boolean
        default: true

permissions: {}

# Superseded pull request runs are cancelled; runs on main, tags, schedules
# and dispatches get a unique group so they are never cancelled or replaced.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  classify:
    name: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      linux-node: ${{ steps.classify.outputs.linux-node }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # Docs-only pushes to main are LIGHT (ADR-0014 amendment 1). The push's
      # `before` commit is fetched alone at depth 1 (a tree diff needs no
      # history). The read-only job token is passed for this one command and
      # not persisted. A new branch (all-zero id) or an unfetchable `before`
      # (force push) leaves the diff uncomputable, and the classifier picks FULL.
      - name: Fetch the commit before the push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
          TOKEN: ${{ github.token }}
        run: |
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]]; then
            auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
            echo "::add-mask::${auth}"
            # The header goes through the environment, not argv, so it never
            # appears in the process list.
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
              git fetch --no-tags --depth=1 origin "$BEFORE" \
              || echo "::warning::could not fetch the push base; the classifier will choose FULL"
          fi

      - name: Classify the change set
        id: classify
        env:
          CI_FULL_REQUESTED: ${{ inputs.full == true }}
        run: node scripts/ci-classify.mjs

  docs:
    name: docs
    needs: classify
    if: needs.classify.outputs.tier == 'LIGHT'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node-version: '22'

      - name: Markdown lint and offline link check
        run: pnpm run lint:md

      - name: Privacy scan of the tree
        run: pnpm run privacy:tree

  linux:
    name: linux (node ${{ matrix.node }})
    needs: classify
    if: needs.classify.outputs.tier == 'STANDARD' || needs.classify.outputs.tier == 'FULL'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        node: ${{ fromJSON(needs.classify.outputs.linux-node) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Check (format, build, lint, depcruise, tests with coverage, API reports, privacy)
        run: pnpm run check

  windows:
    name: windows (node 22)
    needs: [classify, linux]
    if: needs.classify.outputs.tier == 'FULL'
    runs-on: windows-2025
    # K15 (ADR-0014 amendment 4): estimated p95 x 2, from measurements of
    # 2026-10-13. Run 38378992857 reached `vitest` 3 min 20 s after the job
    # started (setup 65 s, static checks with a clean build 136 s). The test
    # step takes 28 s on a local Windows 11 host; Linux CI runs the suite
    # 2.6x slower than that host, so about 75 s here, plus about 40 s for the
    # API reports, the privacy scan and the post steps. Job about 5.5 min,
    # p95 taken as 7 min. Estimate, not yet a measured CI p95: re-size from
    # the first green runs. Provisional 20 until then (lead): the 27 s CIM
    # query cause is inferred, and a cancelled run loses the test output that
    # would show whether it was right.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node-version: '22'

      # Windows checks exercise the real job addon (plan §6.2, lead rulings on
      # A2): it is built here with the image's default toolset and staged; the
      # suites load it with the digest of the staged bytes. The committed
      # table holds the release record and is checked against the build only
      # on the toolchain of record (scripts/test/addon-record.test.ts says
      # which fields differ otherwise). The toolchain is recorded first, with
      # whether the toolset of record (A3) is on the image. A missing
      # component fails the job with its name: nothing is installed here and
      # `/Qspectre` is never dropped.
      - name: Record the job addon toolchain
        run: |
          set -euo pipefail
          vswhere='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
          tools=Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          spectre=Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre
          cmake --version | head -n 1
          install="$("$vswhere" -latest -products '*' -requires "$tools" -property installationPath)"
          if [[ -z "$install" ]]; then
            echo "::error::no Visual Studio instance on this image has ${tools} (the MSVC x64 tools)"
            exit 1
          fi
          echo "Visual Studio $("$vswhere" -latest -products '*' -requires "$tools" -property catalog_productDisplayVersion) at ${install}"
          if [[ -z "$("$vswhere" -latest -products '*' -requires "$tools" "$spectre" -property installationPath)" ]]; then
            echo "::error::the runner image lacks ${spectre}, the Spectre-mitigated libraries the addon links with /Qspectre; it is never installed or dropped here"
            exit 1
          fi
          root="$(cygpath -u "$install")"
          msvc="$(tr -d '\r\n' < "${root}/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt")"
          echo "MSVC toolset ${msvc}"
          # cl without arguments prints its banner (compiler version) and a usage line.
          "${root}/VC/Tools/MSVC/${msvc}/bin/Hostx64/x64/cl.exe" 2>&1 | head -n 1 || true
          # The toolset of record (native/win32-job/release/, MSVC 14.44.35207
          # with Spectre libraries, Windows SDK 10.0.26100): reported, never
          # installed (A3 relies on these lines).
          echo "MSVC toolsets in that instance: $(ls "${root}/VC/Tools/MSVC" | tr '\n' ' ')"
          for component in \
            Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64 \
            Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64.Spectre \
            Microsoft.VisualStudio.Component.Windows11SDK.26100; do
            if [[ -n "$("$vswhere" -latest -products '*' -requires "$component" -property installationPath)" ]]; then
              echo "toolset of record: ${component} installed"
            else
              echo "toolset of record: ${component} NOT installed"
            fi
          done

      - name: Build the job addon (x64) with the image's toolset and stage it
        run: |
          set -euo pipefail
          pnpm run addon:stage
          echo 'staged toolchain.json:'
          cat packages/win32-job-x64/toolchain.json

      - name: Check (format, build, lint, depcruise, tests with coverage, API reports, privacy)
        run: pnpm run check

  macos:
    name: macos (darwin-arm64, node 22)
    needs: [classify, linux]
    if: needs.classify.outputs.tier == 'FULL'
    runs-on: macos-15
    # K15: estimated p95 x 2. The last two runs took 68 s (green) and 78 s
    # (tests failed after 21 s); the launcher and leak tests that now run in
    # full add about 25 s. Job about 2 min, p95 taken as 3 min. Static checks,
    # unit and conformance only until the macOS gate passes (K15).
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          node-version: '22'

      - name: Check (format, build, lint, depcruise, tests with coverage, API reports, privacy)
        run: pnpm run check

  ci-gate:
    name: ci-gate
    needs: [classify, docs, linux, windows, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Evaluate the results of every job
        env:
          CI_TIER: ${{ needs.classify.outputs.tier }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
